<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061425"><title>ON THE MOVE | Login</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071626;color:white;font-family:Arial,sans-serif}button,input{font:inherit}.hero{height:clamp(260px,55vw,560px);background:url('reference-hero.jpg') center center/cover no-repeat}.login-panel{position:relative;width:min(92%,620px);margin:-15px auto 0;padding:26px 20px 28px;border:1px solid #24415c;border-radius:22px;background:linear-gradient(150deg,#071523,#0a1b30);box-shadow:0 15px 50px #0007}.login-panel h1{text-align:center;margin:0 0 7px;font-size:clamp(27px,5vw,38px)}.subtitle{text-align:center;color:#aebed2;margin:0 0 24px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:23px;border:1px solid #35506c;border-radius:11px;overflow:hidden}.role{background:#081629;color:#fff;border:0;padding:14px 5px;min-height:65px;cursor:pointer;font-size:clamp(12px,2.7vw,15px)}.role[aria-selected=true]{background:#0969f7}.field{display:block;margin:16px 0 6px;font-weight:600;font-size:14px}.entry{width:100%;height:52px;border-radius:10px;border:1px solid #39536e;background:#1b2e43;color:#fff;padding:0 15px;font-size:16px;outline:none}.entry:focus{border-color:#4aa2ff;box-shadow:0 0 0 2px #0a73ff55}.pwrow{position:relative}.pwrow .entry{padding-right:65px}.toggle{position:absolute;right:8px;top:7px;padding:9px;border:0;background:transparent;color:#bcd4f5;cursor:pointer}.forgot-row{text-align:right;margin:12px 0 22px}.forgot-row a{color:#63aaff;text-decoration:none;font-size:14px}.signin,.signup{display:block;width:100%;padding:16px;border-radius:10px;text-align:center;font-weight:bold;text-decoration:none;cursor:pointer}.signin{background:#0969f7;color:white;border:0}.signin:disabled{opacity:.7}.or{text-align:center;color:#a8b8c9;margin:20px 0}.signup{border:1px solid #fff;background:transparent;color:white}.error{min-height:22px;margin:14px 0 0;text-align:center;color:#ffb9c0;font-size:14px}.bottom-fill{min-height:20vh;background:#071626 url('bottom-extension.jpg') center top/cover no-repeat}.install-link{display:none}.install-dialog{background:#0b1c34;color:white;border:1px solid #368ff5;border-radius:18px;padding:24px;max-width:400px}.install-dialog button{padding:12px;background:#0969f7;color:white;border:0;border-radius:8px}@media(min-width:750px){.hero{height:490px}.login-panel{margin-top:-50px}}
</style></head><body><header class="hero" aria-label="ON THE MOVE moving company"></header><main class="login-panel"><h1>Welcome Back</h1><p class="subtitle">Sign in to your account to continue.</p><div class="roles" role="tablist" aria-label="Account type"><button class="role" type="button" data-role="customer" aria-selected="true">Customer</button><button class="role" type="button" data-role="mover" aria-selected="false">Moving Company</button><button class="role" type="button" data-role="admin" aria-selected="false">Admin</button></div><form id="login"><label class="field" for="email">Email Address</label><input class="entry" id="email" type="email" placeholder="Enter your email" autocomplete="email" required><label class="field" for="password">Password</label><div class="pwrow"><input class="entry" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="toggle" type="button" id="toggle">Show</button></div><div class="forgot-row"><a id="forgotLink" href="account.html">Forgot Password?</a></div><button class="signin" id="submit" type="submit">Sign In →</button><div id="message" class="error" role="status" aria-live="polite"></div></form><div class="or">OR</div><div id="signup"><a class="signup" id="signupLink" href="account.html">Create New Account</a></div><p id="note" hidden></p></main><div class="bottom-fill" aria-hidden="true"></div><button class="install-link" id="installApp" hidden type="button">Install ON THE MOVE App</button><dialog id="installDialog" class="install-dialog"><h3>Add ON THE MOVE to your phone</h3><p id="installSteps">On iPhone: open this page in Safari, tap Share, then Add to Home Screen and Add.</p><button type="button" id="closeInstall">Got it</button></dialog><script>let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});document.getElementById('installApp').addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else{document.getElementById('installDialog').showModal()}});document.getElementById('closeInstall').onclick=()=>document.getElementById('installDialog').close();</script><script type="module">

const sb=createClient('https://emltgdbuodvansomhgug.supabase.co','sb_publishable_z0uZqXtVfa-MU5UHpOJOAQ_doKLQeGN');let role='customer';const $=id=>document.getElementById(id);const pages={customer:'account.html',mover:'mover.html',admin:'admin.html'};const roles=document.querySelectorAll('.role');function choose(r){role=r;roles.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.role===r)));$('signup').hidden=r==='admin';$('signupLink').href=pages[r];$('forgotLink').href=pages[r];$('note').textContent=r==='admin'?'Admin access is restricted to approved ON THE MOVE administrators.':r==='mover'?'Moving companies can register and track their approval status.':'Your login is secured by ON THE MOVE’s account system.';$('message').textContent=''}roles.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.role)));$('toggle').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('toggle').textContent=p.type==='password'?'Show':'Hide';$('toggle').style.color='#bcd4f5'};
